services:
  db:
    image: mysql:8.0
    container_name: meetgold_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: meetdraw_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: meetgold_server
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: meetdraw-jwt-secret-key-super-secure-2026
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: admin
      DB_NAME: meetdraw_db
      DB_SSL: "false"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
